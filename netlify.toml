[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ─── FUNCTION DEFAULTS ───
# NOTE: `memory` and `timeout` are NOT valid keys under the top-level
# `[functions]` table in the current Netlify schema. They must be
# applied per-function using `[functions."<name>"]` blocks, or omitted
# entirely to use Netlify's defaults (1024 MB, 10 s).
#
# `netlify dev` rejects the whole config if these keys are present here,
# which is what produced:
#   "Configuration property functions.timeout must be an object."
[functions]
  node_bundler = "esbuild"
  included_files = [
    "!node_modules/.cache/**",
    "!**/*.test.js",
    "!**/*.spec.js"
  ]

# ─── WEBHOOK TIMEOUT ───
# The Paystack webhook does a Paystack verify call plus, on renewal
# paths, a transfer API call. 10 s of default budget is tight; 30 s
# gives comfortable headroom without holding a slot open indefinitely.
[functions."paystack-webhook"]
  timeout = 30

# ─── SCHEDULED FUNCTIONS ───
# Timeouts here are generous because these run on a schedule, not on
# user requests — nobody is waiting on them.
[functions."check-expired-subscriptions"]
  schedule = "0 0 * * *"
  timeout = 30

[functions."send-expiry-reminders"]
  schedule = "0 8 * * *"
  timeout = 60

# ─── RATE LIMITING ───
[[rate_limit]]
  pattern = "/.netlify/functions/*"
  rate = "100 per minute"

# ─── Payment / money endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/initialize-payment"
  rate = "10 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/initialize-subscription"
  rate = "10 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/create-subaccount"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/update-subaccount"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/save-business"
  rate = "5 per minute"

# ─── Auth endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/admin-login"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/dashboard-login"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/affiliate-login"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/save-affiliate"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/send-reset-otp"
  rate = "3 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/verify-reset-otp"
  rate = "3 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/get-dashboard-questions"
  rate = "5 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/update-security"
  rate = "5 per minute"

# ─── Affiliate endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/get-affiliate-data"
  rate = "30 per minute"

# ─── Admin write endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/admin-businesses"
  rate = "30 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/admin-businesses-bulk"
  rate = "10 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/admin-settings"
  rate = "20 per minute"

# ─── Booking / offline payment endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/submit-offline-booking"
  rate = "10 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/verify-offline-booking"
  rate = "10 per minute"

# ─── Read endpoints ───
[[rate_limit]]
  pattern = "/.netlify/functions/get-business-items"
  rate = "30 per minute"

[[rate_limit]]
  pattern = "/.netlify/functions/get-subscription-history"
  rate = "10 per minute"

# ─── REDIRECTS (ORDER MATTERS!) ───

# 1. API PROXY: Maps frontend /api/* calls to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. SPA FALLBACK: Catch-all for React Router (Must be last!)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── SECURITY HEADERS ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ═══════════════════════════════════════════════════════════════
# CACHE POLICIES — ORDER IS CRITICAL
#
# Netlify resolves overlapping header rules by FILE ORDER: the first
# rule that matches a URL wins, and later matches for the same header
# are ignored. So the most specific rules MUST come first.
#
# Previous bug: `for = "/*.js"` was listed above `for = "/sw.js"`,
# so the service worker matched the 1-year immutable rule and got
# cached on users' devices. That meant template changes were invisible
# for returning visitors — they kept loading old JS bundles from the
# old SW until the SW's own cache expired ~12 months later.
#
# Fix: SW, HTML, and anything that must stay fresh are listed BEFORE
# the aggressive JS/CSS cache rules.
# ═══════════════════════════════════════════════════════════════

# ─── Must NEVER be cached long-term ───

# Service worker — the single most important file to keep fresh.
# If this is stale, no other update reaches the user.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Workbox runtime if it ever lands at root under a different name
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML — the entry point. Always revalidate so new hashed bundles
# referenced inside are picked up on the next load.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Prerendered blog pages (React Router URL is /blog/<slug>, so the
# header pattern must match that URL, not the file path on disk)
[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Long-term immutable assets ───
# Vite hashes filenames on every build, so a filename change == a new
# file. Safe to cache for a year. Scoped to /assets/ so it can't
# accidentally catch /sw.js or any other root-level JS.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Short-lived metadata ───

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fav*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"